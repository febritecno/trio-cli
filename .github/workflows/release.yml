name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Test
        run: |
          zig build -Drelease=true
          test/smoke.sh
      - name: Build all targets
        run: |
          mkdir dist
          for t in aarch64-macos:darwin-arm64 x86_64-macos:darwin-x64 aarch64-linux-musl:linux-arm64 x86_64-linux-musl:linux-x64; do
            zig build -Dtarget="${t%%:*}" -Drelease=true --prefix "dist/${t##*:}"
            tar -C "dist/${t##*:}/bin" -czf "dist/trio-${t##*:}.tar.gz" trio
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --clobber ||
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --generate-notes
